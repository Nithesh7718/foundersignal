services:
  db:
    image: postgres:16-alpine
    container_name: foundersignal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foundersignal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foundersignal_secret}
      POSTGRES_DB: ${POSTGRES_DB:-foundersignal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foundersignal} -d ${POSTGRES_DB:-foundersignal}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
